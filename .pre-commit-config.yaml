default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: mypy
        name: mypy
        entry: uv run mypy src main.py
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]
